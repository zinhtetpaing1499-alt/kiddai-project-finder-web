<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Kiddai Install</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section id="view-login" class="login">
      <form id="login-form" class="card">
        <div class="mark" aria-hidden="true">K</div>
        <h1>Kiddai Install</h1>
        <p class="lede">Site chat</p>
        <label>
          Username
          <input name="username" autocomplete="username" required />
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="error" role="alert"></p>
        <button type="submit">Sign in</button>
      </form>
    </section>

    <section id="view-admin" class="admin" hidden>
      <header class="topbar">
        <div class="brand">
          <span class="mark sm" aria-hidden="true">K</span>
          <strong>Kiddai</strong>
          <span class="muted">Install</span>
        </div>
        <div class="top-actions">
          <span id="admin-who" class="muted"></span>
          <button type="button" id="admin-logout" class="ghost">Log out</button>
        </div>
      </header>
      <div class="admin-body">
        <aside class="col projects-col">
          <h2>Projects</h2>
          <form id="new-project" class="new-project">
            <label class="sr" for="new-project-name">New project</label>
            <input id="new-project-name" name="name" maxlength="80" placeholder="New project" autocomplete="off" required />
            <button type="submit">Add</button>
          </form>
          <div id="project-list" class="project-list"></div>
        </aside>
        <main class="col thread-col">
          <header class="thread-head">
            <h2 id="thread-title">Select a project</h2>
            <p id="thread-who" class="muted"></p>
          </header>
          <div id="admin-messages" class="messages"></div>
          <form id="admin-composer" class="composer" hidden>
            <label class="sr" for="admin-text">Message</label>
            <textarea id="admin-text" rows="2" maxlength="4000" placeholder="What the installer needs"></textarea>
            <div class="composer-row">
              <button type="button" class="ghost" id="admin-photo">Photo</button>
              <button type="button" class="ghost" id="admin-video">Video</button>
              <span id="admin-file-name" class="file-name"></span>
              <button type="button" class="ghost" id="admin-file-clear" hidden>Remove</button>
              <button type="submit">Send</button>
            </div>
            <input id="admin-file" type="file" hidden />
            <p id="admin-error" class="error" role="alert"></p>
          </form>
        </main>
        <aside class="col people-col">
          <h2>Installers</h2>
          <p class="hint">Each person has one chat. Move changes which project they see.</p>
          <p id="move-status" class="status" role="status"></p>
          <div id="installer-list"></div>
        </aside>
      </div>
    </section>

    <section id="view-installer" class="installer" hidden>
      <div class="phone">
        <header class="phone-head">
          <div>
            <p class="brand-line">Kiddai</p>
            <h1 id="job-title">No job yet</h1>
          </div>
          <button type="button" id="installer-logout" class="ghost">Log out</button>
        </header>
        <div id="installer-empty" class="empty">
          <p>No job yet</p>
          <p class="muted">The office will put you in a chat.</p>
        </div>
        <div id="installer-messages" class="messages" hidden></div>
        <form id="installer-composer" class="composer" hidden>
          <label class="sr" for="installer-text">Message</label>
          <input id="installer-text" maxlength="4000" placeholder="Send an update" autocomplete="off" />
          <div class="composer-row">
            <button type="button" class="ghost" id="installer-photo">Photo</button>
            <span id="installer-file-name" class="file-name"></span>
            <button type="button" class="ghost" id="installer-file-clear" hidden>Remove</button>
            <button type="submit">Send</button>
          </div>
          <input id="installer-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden />
          <p id="installer-error" class="error" role="alert"></p>
        </form>
      </div>
    </section>

    <script src="/app.js" type="module"></script>
  </body>
</html>
